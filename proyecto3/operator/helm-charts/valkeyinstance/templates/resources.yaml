apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-valkey
spec:
  selector: {app: {{ .Release.Name }}-valkey}
  ports:
    - {name: redis, port: 6379, targetPort: redis}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ .Release.Name }}-valkey
spec:
  serviceName: {{ .Release.Name }}-valkey
  replicas: 1
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: Retain
  selector:
    matchLabels: {app: {{ .Release.Name }}-valkey}
  template:
    metadata:
      labels: {app: {{ .Release.Name }}-valkey}
    spec:
      securityContext: {fsGroup: 999, runAsUser: 999, runAsGroup: 999, runAsNonRoot: true}
      containers:
        - name: valkey
          image: {{ .Values.image | quote }}
          imagePullPolicy: IfNotPresent
          command: [valkey-server]
          args: ["--appendonly", "yes", "--appendfsync", "everysec", "--maxmemory", {{ .Values.maxMemory | quote }}, "--maxmemory-policy", "noeviction"]
          ports: [{name: redis, containerPort: 6379}]
          resources: {{ .Values.resources | toJson }}
          readinessProbe:
            exec: {command: [valkey-cli, ping]}
            initialDelaySeconds: 2
          livenessProbe:
            exec: {command: [valkey-cli, ping]}
            initialDelaySeconds: 10
          volumeMounts: [{name: data, mountPath: /data}]
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        {{- if .Values.storageClassName }}
        storageClassName: {{ .Values.storageClassName | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.storageSize | quote }}
