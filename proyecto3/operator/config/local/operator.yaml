apiVersion: v1
kind: Namespace
metadata: {name: mumn}
---
apiVersion: v1
kind: ServiceAccount
metadata: {name: mumn-operator, namespace: mumn}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: {name: mumn-operator, namespace: mumn}
rules:
  - apiGroups: [monitoring.so1.local]
    resources: [valkeyinstances, valkeyinstances/status, valkeyinstances/finalizers, grafanainstances, grafanainstances/status, grafanainstances/finalizers]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: ['']
    resources: [secrets, configmaps, services, pods, persistentvolumeclaims, events]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [apps]
    resources: [deployments, statefulsets, replicasets]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [coordination.k8s.io]
    resources: [leases]
    verbs: [get, list, watch, create, update, patch, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: mumn-operator, namespace: mumn}
subjects:
  - {kind: ServiceAccount, name: mumn-operator, namespace: mumn}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: mumn-operator}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: mumn-operator, namespace: mumn}
spec:
  replicas: 1
  selector:
    matchLabels: {app: mumn-operator}
  template:
    metadata:
      labels: {app: mumn-operator}
    spec:
      serviceAccountName: mumn-operator
      containers:
        - name: operator
          image: controller:latest
          imagePullPolicy: IfNotPresent
          args: [--leader-elect, --leader-election-id=mumn-operator, --health-probe-bind-address=:8081]
          env:
            - name: WATCH_NAMESPACE
              valueFrom: {fieldRef: {fieldPath: metadata.namespace}}
          readinessProbe:
            httpGet: {path: /readyz, port: 8081}
            initialDelaySeconds: 5
          livenessProbe:
            httpGet: {path: /healthz, port: 8081}
            initialDelaySeconds: 15
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {cpu: 500m, memory: 384Mi}
