# Test-only broker and real consumer. GKE production manifests belong to phase 5.
apiVersion: v1
kind: Service
metadata: {name: fixture-rabbitmq, namespace: mumn}
spec:
  selector: {app: fixture-rabbitmq}
  ports: [{port: 5672, targetPort: 5672}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: fixture-rabbitmq, namespace: mumn}
spec:
  replicas: 1
  selector:
    matchLabels: {app: fixture-rabbitmq}
  template:
    metadata:
      labels: {app: fixture-rabbitmq}
    spec:
      containers:
        - name: rabbitmq
          image: rabbitmq:4.1-alpine
          env:
            - {name: RABBITMQ_DEFAULT_USER, value: fixture}
            - {name: RABBITMQ_DEFAULT_PASS, value: local-fixture-only}
          readinessProbe:
            tcpSocket: {port: 5672}
            initialDelaySeconds: 15
            periodSeconds: 5
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {cpu: 500m, memory: 512Mi}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: fixture-consumer, namespace: mumn}
spec:
  replicas: 1
  selector:
    matchLabels: {app: fixture-consumer}
  template:
    metadata:
      labels: {app: fixture-consumer}
    spec:
      containers:
        - name: consumer
          image: mumn-go:phase4
          imagePullPolicy: IfNotPresent
          args: [consumer]
          env:
            - {name: RABBITMQ_URL, value: 'amqp://fixture:local-fixture-only@fixture-rabbitmq:5672/'}
            - {name: VALKEY_ADDR, value: 'store-valkey:6379'}
          resources:
            requests: {cpu: 20m, memory: 32Mi}
            limits: {cpu: 200m, memory: 128Mi}
---
apiVersion: batch/v1
kind: Job
metadata: {name: fixture-publisher, namespace: mumn}
spec:
  backoffLimit: 8
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: publisher
          image: mumn-go:phase4
          imagePullPolicy: IfNotPresent
          command: [/usr/local/bin/fixture-publisher]
          env:
            - {name: RABBITMQ_URL, value: 'amqp://fixture:local-fixture-only@fixture-rabbitmq:5672/'}
          volumeMounts:
            - {name: fixtures, mountPath: /fixtures}
      volumes:
        - name: fixtures
          configMap: {name: fixture-data}
